<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>detail-page - Jennie Portfolio</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- CSS -->
    <!-- detail-page CSS -->
    <link rel="stylesheet" href="./css/detail-page5.css" />

    <!-- cursor css -->
    <link rel="stylesheet" href="./css/cursor.css" />

    <!-- 미디어 쿼리 css -->
    <link rel="stylesheet" href="./css/media-index.css" />
    <link rel="stylesheet" href="./css/media-detail.css" />
  </head>

  <body>
    <!-- Header 불러올 위치 -->
    <div id="nav"></div>

    <!-- ***************************************************************** -->
    <!-- ************************ 바디럽 프로모션 ************************ -->

    <!-- 메인 섹션 -->
    <main id="detail-page" class="bl-main">
      <!-- 섹션1 롱 이미지 -->
      <section class="bl">
        <img src="./img/detail/project5/bl_long.png" alt="bl_long" />
      </section>

      <!-- 섹션2 상품 연출컷 -->
      <section class="bl-poto">
        <div class="bl-poto-img">
          <img
            class="bl-logo"
            src="./img/detail/project5/bl_logo.png"
            alt="bl_logo"
          />
          <img
            class="bl-so1"
            src="./img/detail/project5/bl_so1.png"
            alt="bl_poto1"
          />
          <img
            class="bl-so2"
            src="./img/detail/project5/bl_so2.png"
            alt="bl_poto2"
          />
          <img
            class="bl-so3"
            src="./img/detail/project5/bl_so3.png"
            alt="bl_poto3"
          />
          <img
            class="bl-so4"
            src="./img/detail/project5/bl_so4.png"
            alt="bl_poto4"
          />
        </div>
        <div class="bl-poto-text">
          <p class="bl-poto-text1">
            We consider everything about our <br />
            bodies and propose a more comfortable <br />
            and safer everyday life.
          </p>
          <h1 class="bl-poto-text2">
            bodyluv, <br />
            Made for Greater <br />
            Comfort
          </h1>
        </div>
      </section>

      <!-- 섹션3 오피셜 -->
      <section class="bl-official">
        <!-- 텍스트 -->
        <div class="official-text">
          <p class="official-text-sub">
            별도의 프로모션 없이 운영되는 브랜드 일상 계정을 구성한 메인
            페이지입니다.
          </p>
          <h1 class="official-text-title">Brand Official Account Main</h1>
        </div>

        <!-- 이미지 -->
        <div class="official-img">
          <img
            src="../03.구현소스/img/detail/project5/bl_of.png"
            alt="of-img1"
          />
        </div>
      </section>

      <!-- 섹션4 프로모션 -->
      <!-- 텍스트 -->
      <div class="promotion-text">
        <p class="promotion-text-sub">
          프로모션 배너 및 SNS 업로드용 콘텐츠입니다.
        </p>
        <h1 class="promotion-text-title">Brand Promotions</h1>
      </div>
      <!-- 이미지 -->
      <div class="promotion-img">
        <img src="../03.구현소스/img/detail/project5/bl_pm.png" alt="p-img" />
      </div>

      <!-- 섹션5 추가 이미지 -->
      <div class="bl-more">
        <img
          src="../03.구현소스/img/detail/project5/bl_more1.jpg"
          alt="bl-more1"
        />
        <img
          src="../03.구현소스/img/detail/project5/bl_more2.jpg"
          alt="bl-more2"
        />
        <img
          src="../03.구현소스/img/detail/project5/bl_more3.jpg"
          alt="bl-more3"
        />
        <img
          src="../03.구현소스/img/detail/project5/bl_more4.jpg"
          alt="bl-more4"
        />
        <img
          src="../03.구현소스/img/detail/project5/bl_more5.jpg"
          alt="bl-more5"
        />
      </div>
    </main>

    <!-- ***************************************************************** -->
    <!-- back 클릭 -->
    <div class="back-click">
      <a href="../03.구현소스/works.html">
        <p>
          <span class="back-arrow">←</span>
        </p>
      </a>
    </div>

    <!-- ***************************************************************** -->

    <!-- Footer 불러올 위치 -->
    <div id="footer"></div>

    <!-- 마우스 커서 커스텀 -->
    <div class="custom-cursor"></div>

    <!-- JavaScript 파일 연결 -->
    <script src="./js/script.js"></script>
    <script src="./js/detail-page.js"></script>
    <script src="./js/detail-page5.js"></script>
    <script src="./js/cursor.js"></script>
  </body>
</html>
