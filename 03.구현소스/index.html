<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jennie Portfolio</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- 상단 카테고리 -->
    <nav class="nav">
      <a href="#home">Home</a>
      <a href="#works">Works</a>
      <a href="#about">About me</a>
      <a href="#contact">Contact</a>
    </nav>

    <!-- 메인 섹션 -->
    <main class="main">
      <!-- 왼쪽 텍스트 -->
      <div class="left-text">Jennie’s Visual Archive</div>

      <!-- 중간 이미지 -->
      <div class="center-image">
        <canvas id="je-gif"></canvas>
      </div>

      <!-- 오른쪽 텍스트 -->
      <div class="right-text">Portfolio 2025</div>

      <!-- 하단 스크롤 가이드 -->
      <div class="scroll-guide">
        <p>Scroll to explore</p>
        <span class="arrow">↓</span>
      </div>
    </main>

    <!-- Works 섹션 -->
    <section class="works-section">
      <div class="container">
            <div class="work-tab-wrap">
        <div class="work-tab">01 WEB DESIGN</div>
        </div>

        <div class="work-box">
          <div class="work-content">
            <!-- 왼쪽 정보 영역 -->
            <div class="work-info">
              <h2 class="work-title">
                HUGO<br />
                위고 출판사
              </h2>
              <p class="work-description">사이트 설명</p>

              <div class="work-tools">
                <p class="tools-label">구격 및 사용한 툴</p>
                <div class="tools-grid">
                  <div class="tool-item"></div>
                  <div class="tool-item"></div>
                  <div class="tool-item"></div>
                  <div class="tool-item"></div>
                </div>
              </div>
            </div>

            <!-- 오른쪽 이미지 영역 -->
            <div class="work-images">
              <div class="image-main"></div>
              <div class="image-side">
                <div class="image-small"></div>
                <div class="image-small"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 마우스 커서 커스텀 -->
    <div class="custom-cursor"></div>

    <!-- js 불러오기 -->
    <script src="./js/script.js"></script>
  </body>
</html>
