    <title>detail-page - Jennie Portfolio</title>
    <link

    />
    <!-- CSS -->
    <!-- detail-page CSS -->
    <link rel="stylesheet" href="./css/detail-page4.css" />

    <!-- cursor css -->

    <!-- 메인 섹션 -->
    <main id="detail-page" class="yj-main">
      <!-- 섹션1 롱 이미지 -->
      <section class="yj">
        <img src="./img/detail/project4/yj_long.jpg" alt="yj_long" />
      </section>

      <!-- 섹션3 오피셜 -->

        <div class="official-text">

            브랜드 공식 계정에 업로드되는 SNS 콘텐츠입니다.
          </p>
          <h1 class="official-text-title">Brand Official SNS Content</h1>

        <div class="official-img">
          <img
            src="../03.구현소스/img/detail/project4/yj_of.png"
            alt="of-img1"
          />
        </div>
      </section>

      <!-- 섹션4 가로 슬라이더 이미지 -->
      <div class="yj-slider">
        <div class="yj-slide-track">
          <div class="yj-slide1">
            <img
              src="../03.구현소스/img/detail/project4/yj_s1.png"

            />

          <div class="yj-slide2">

            />

          <div class="yj-slide3">
            <img
              src="../03.구현소스/img/detail/project4/yj_s3.png"

          <div class="yj-slide4">

          <div class="yj-slide5">
            <img
              src="../03.구현소스/img/detail/project4/yj_s5.png"
              alt="slide-img5"
            />
          </div>
        </div>
      </div>

      <!-- 섹션5 프로모션 -->
      <!-- 텍스트 -->
      <div class="promotion-text">
        <p class="promotion-text-sub">
          브랜드 공식 계정에 업로드되는 SNS 콘텐츠입니다.
        </p>

      <!-- 이미지 -->

          src="../03.구현소스/img/detail/project4/yj_promotion.png"

        />

      <div class="yj-more">
        <img
          src="../03.구현소스/img/detail/project4/yj_more1.jpg"
