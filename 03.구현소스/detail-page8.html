<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>detail-page - Jennie Portfolio</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./css/detail-page8.css" />
    <link rel="stylesheet" href="./css/cursor.css" />
    <link rel="stylesheet" href="./css/media-index.css" />
    <link rel="stylesheet" href="./css/media-detail.css" />
    <link rel="stylesheet" href="./css/media-detail-page8.css" />
  </head>

  <body>
    <div id="nav"></div>

    <main id="detail-page" class="an-main">

      <!-- an-wrapper: cfs-wrapper와 동일한 방식
           position: relative → 내부 absolute 요소의 top% 기준점
           이미지가 렌더링되면 wrapper 높이 = 이미지 높이가 되어
           top%가 항상 이미지 기준으로 정확히 고정됨 -->
      <div class="an-wrapper">

        <!-- 롱 이미지 -->
        <section class="an">
          <img src="./img/detail/project8/an_long.jpg" alt="an_long" />
        </section>

        <!-- 홍보 영상 -->
        <section class="an-video">
          <iframe
            id="an-youtube"
            width="1920"
            height="1080"
            src="https://www.youtube.com/embed/rZMPA2DKGnU?si=EJ2e0TEffNp6BwaJ&enablejsapi=1"
            data-src-autoplay="https://www.youtube.com/embed/rZMPA2DKGnU?autoplay=1&mute=1&loop=1&playlist=rZMPA2DKGnU"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share;"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </section>

        <!-- NFT 리빌 영상 -->
        <section class="an-reville-video">
          <video muted playsinline loop autoplay>
            <source src="./img/detail/project8/an_Reville.mp4" type="video/mp4" />
          </video>
        </section>

      </div>
      <!-- /an-wrapper -->

    </main>

    <div class="back-click">
      <a href="../03.구현소스/works.html">
        <p><span class="back-arrow">←</span></p>
      </a>
    </div>

    <div id="footer"></div>
    <div class="custom-cursor"></div>

    <script src="./js/script.js"></script>
    <script src="./js/detail-page.js"></script>
    <script src="./js/detail-page8.js"></script>
    <script src="./js/cursor.js"></script>
  </body>
</html>
