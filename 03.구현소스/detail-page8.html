<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>detail-page - Jennie Portfolio</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- CSS -->
    <!-- detail-page CSS -->
    <link rel="stylesheet" href="./css/detail-page8.css" />

    <!-- cursor css -->
    <link rel="stylesheet" href="./css/cursor.css" />

    <!-- 미디어 쿼리 css -->
    <link rel="stylesheet" href="./css/media-index.css" />
    <link rel="stylesheet" href="./css/media-detail.css" />
  </head>

  <body>
    <!-- Header 불러올 위치 -->
    <div id="nav"></div>

    <!-- ***************************************************************** -->
    <!-- ************************ 애니큐브 브랜딩 ************************ -->

    <!-- 메인 섹션 -->
    <main id="detail-page" class="an-main">
      <!-- ***** 섹션1 롱 이미지 ***** -->
      <section class="an">
        <img src="./img/detail/project8/an_long.jpg" alt="an_long" />
      </section>
      <!-- 홍보 영상 -->
      <section class="an-video">
        <iframe
          id="an-youtube"
          width="1920"
          height="1080"
          src="https://www.youtube.com/embed/rZMPA2DKGnU?si=EJ2e0TEffNp6BwaJ&enablejsapi=1"
          data-src-autoplay="https://www.youtube.com/embed/rZMPA2DKGnU?autoplay=1&mute=1&loop=1&playlist=rZMPA2DKGnU"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </section>

      <!-- NFT 리빌 영상 -->
      <section class="an-reville-video">
        <video
          id="an-reville-video"
          width="812"
          height="812"
          muted
          playsinline
          loop
          autoplay
        >
          <source src="./img/detail/project8/an_Reville.mp4" type="video/mp4" />
        </video>
      </section>
    </main>

    <!-- ***************************************************************** -->
    <!-- back 클릭 -->
    <div class="back-click">
      <a href="../03.구현소스/works.html">
        <p>
          <span class="back-arrow">←</span>
        </p>
      </a>
    </div>

    <!-- ***************************************************************** -->

    <!-- Footer 불러올 위치 -->
    <div id="footer"></div>

    <!-- 마우스 커서 커스텀 -->
    <div class="custom-cursor"></div>

    <!-- JavaScript 파일 연결 -->
    <script src="./js/script.js"></script>
    <script src="./js/detail-page.js"></script>
    <script src="./js/detail-page8.js"></script>
    <script src="./js/cursor.js"></script>
  </body>
</html>
