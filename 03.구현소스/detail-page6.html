<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>detail-page - Jennie Portfolio</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- CSS -->
    <!-- detail-page CSS -->
    <link rel="stylesheet" href="./css/detail-page6.css" />

    <!-- cursor css -->
    <link rel="stylesheet" href="./css/cursor.css" />

    <!-- 미디어 쿼리 css -->
    <link rel="stylesheet" href="./css/media-index.css" />
    <link rel="stylesheet" href="./css/media-detail.css" />
  </head>

  <body>
    <!-- Header 불러올 위치 -->
    <div id="nav"></div>

    <!-- ***************************************************************** -->
    <!-- ************************ 키르시 프로모션 ************************ -->

    <!-- 메인 섹션 -->
    <main id="detail-page" class="ks-main">
      <!-- ***** 섹션1 롱 이미지 ***** -->
      <section class="ks">
        <img src="./img/detail/project6/ks_long.png" alt="ks_long" />
      </section>

      <!-- ***** 섹션2 가로 슬라이더 태그 1 ***** -->
      <!-- 체리 슬라이더로 무한 반복 -->
      <div class="ks-tag-slider1">
        <div class="ks-tag-slide-track">
          <div class="ks-tag-slide">
            <img src="./img/detail/project6/tag1.png" alt="tag-img1" />
          </div>
          <div class="ks-tag-slide">
            <img src="./img/detail/project6/tag2.png" alt="tag-img2" />
          </div>
        </div>
      </div>

      <!-- ***** 섹션3 오피셜 ***** -->
      <section class="ks-official">
        <!-- 텍스트 -->
        <div class="official-text">
          <p class="official-text-sub">
            브랜드 공식 계정에 업로드되는 SNS 콘텐츠입니다.
          </p>
          <h1 class="official-text-title">Brand Official SNS Content</h1>
        </div>

        <!-- 이미지 -->
        <div class="official-img">
          <img src="./img/detail/project6/ks_of.png" alt="of-img1" />
        </div>
      </section>

      <!-- ***** 섹션4 상품 연출컷 ***** -->
      <section class="ks-poto">
        <div class="poto_cut1">
          <img src="./img/detail/project6/poto_cut1.png" alt="ks poto cut1" />
        </div>

        <div class="poto_cut2">
          <img src="./img/detail/project6/poto_cut2.png" alt="ks poto cut2" />
        </div>

        <div class="poto_cut3">
          <img src="./img/detail/project6/poto_cut3.png" alt="ks poto cut3" />
        </div>
      </section>

      <!-- ***** 섹션5  가로 슬라이더 이미지 ***** -->
      <!-- 4개 이미지 슬라이더로 무한 반복 -->
      <div class="ks-slider">
        <div class="ks-slide-track">
          <div class="ks-slide">
            <img src="./img/detail/project6/ks_s1.png" alt="slide-img1" />
          </div>
          <div class="ks-slide">
            <img src="./img/detail/project6/ks_s2.png" alt="slide-img2" />
          </div>
          <div class="ks-slide">
            <img src="./img/detail/project6/ks_s3.png" alt="slide-img3" />
          </div>
          <div class="ks-slide">
            <img src="./img/detail/project6/ks_s4.png" alt="slide-img4" />
          </div>
        </div>
      </div>

      <!-- ***** 섹션6 체리 로고 컷 ***** -->
      <section class="ks-cherry">
        <img src="./img/detail/project6/ks_cherry.png" alt="ks cherry" />
      </section>

      <!-- ***** 섹션7 프로모션 ***** -->
      <!-- 텍스트 -->
      <div class="promotion-text">
        <p class="promotion-text-sub">
          프로모션 배너 및 SNS 업로드용 콘텐츠입니다.
        </p>
        <h1 class="promotion-text-title">Brand Promotions</h1>
      </div>
      <!-- 이미지 -->
      <div class="promotion-img">
        <img src="./img/detail/project6/ks_pm.png" alt="p-img" />
      </div>

      <!-- ***** 섹션8 가로 슬라이더 태그 2 ***** -->
      <!-- 체리 슬라이더로 무한 반복 (역방향) -->
      <div class="ks-tag-slider2">
        <div class="ks-tag-slide-track">
          <div class="ks-tag-slide">
            <img src="./img/detail/project6/tag1.png" alt="tag-img1" />
          </div>
          <div class="ks-tag-slide">
            <img src="./img/detail/project6/tag2.png" alt="tag-img2" />
          </div>
        </div>
      </div>
    </main>

    <!-- ***************************************************************** -->
    <!-- back 클릭 -->
    <div class="back-click">
      <a href="./works.html">
        <p>
          <span class="back-arrow">←</span>
        </p>
      </a>
    </div>

    <!-- ***************************************************************** -->

    <!-- Footer 불러올 위치 -->
    <div id="footer"></div>

    <!-- 마우스 커서 커스텀 -->
    <div class="custom-cursor"></div>

    <!-- JavaScript 파일 연결 -->
    <script src="./js/script.js"></script>
    <script src="./js/detail-page.js"></script>
    <script src="./js/detail-page6.js"></script>
    <script src="./js/cursor.js"></script>
  </body>
</html>
